<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1f26;--ink2:#5b6170;--line:#e3e0d8;--accent:#0d6b8f;--warn:#b8321a}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1e2128;--ink:#ecebe6;--ink2:#a0a5b1;--line:#2f333c;--accent:#5cb8dc;--warn:#ff8a70}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif}
button,input{font:inherit}[hidden]{display:none!important}
.gate{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.entry{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.brand{font-size:12px;letter-spacing:2px;color:var(--ink2);text-transform:uppercase}
.entry h1{font-size:20px;margin:6px 0 4px}
.intro,.remember-note{margin:0 0 18px;color:var(--ink2);font-size:14px}
.password-label{display:block;font-size:14px;color:var(--ink2);margin-bottom:6px}
.password{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
.password:focus{border-color:var(--accent)}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin:12px 0 4px;cursor:pointer}
.remember-note{margin:0 0 16px;font-size:13px}
.unlock{width:100%;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.unlock:disabled{opacity:.6;cursor:wait}
.message{color:var(--ink2);font-size:14px;min-height:20px;margin:10px 0 0}.message.error{color:var(--warn)}
.workspace{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.toolbar-title{font-weight:600;color:var(--ink)}.session-message{font-weight:400;color:var(--ink2);margin-left:8px}
.lock{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.frame-host{flex:1;display:flex}.frame-host iframe{flex:1;width:100%;border:0;min-height:calc(100vh - 44px)}
.nojs{padding:24px 16px;color:var(--ink2);text-align:center}

<script>
(function(){
'use strict';
const STORAGE_KEY='mine-watch.encrypted-access.v1';
const $=id=>document.getElementById(id);
const gate=$('gate'),workspace=$('workspace'),form=$('unlock-form'),passwordInput=$('password'),rememberInput=$('remember'),button=$('unlock-button'),message=$('unlock-message'),frameHost=$('report-frame-host');
let operation=0,payload=null,cryptoReady=false;
const normalizePassword=value=>value.normalize('NFKC').trim().toUpperCase();
function refreshTheme(){const hour=new Date(Date.now()+480*60000).getUTCHours();document.documentElement.dataset.theme=hour>=6&&hour<18?'light':'dark';}
function showMessage(text,error=false){message.textContent=text;message.classList.toggle('error',error);}
function setBusy(busy){button.disabled=busy;passwordInput.disabled=busy;rememberInput.disabled=busy;button.textContent=busy?'正在解密…':'打开';form.setAttribute('aria-busy',String(busy));}
function decodeBase64(value){
 if(typeof value!=='string'||!value.length||value.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(value))throw new Error('Invalid encoded data');
 const binary=atob(value),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;
}
function encodeBase64(bytes){let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary);}
function clearRemembered(){try{localStorage.removeItem(STORAGE_KEY);return true;}catch{return false;}}
function readRemembered(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(!saved)return null;
  if(saved.v!==payload.v||saved.kdf!==payload.kdf||saved.hash!==payload.hash||saved.iterations!==payload.iterations||saved.salt!==payload.salt){clearRemembered();return null;}
  const bytes=decodeBase64(saved.key);if(bytes.length!==32){clearRemembered();return null;}return bytes;
 }catch{clearRemembered();return null;}
}
async function saveRemembered(key,currentOperation){
 try{
  const bytes=new Uint8Array(await crypto.subtle.exportKey('raw',key));
  if(currentOperation!==operation){bytes.fill(0);return false;}
  const saved={v:payload.v,kdf:payload.kdf,hash:payload.hash,iterations:payload.iterations,salt:payload.salt,key:encodeBase64(bytes)};bytes.fill(0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));return true;
 }catch{return false;}
}
async function deriveKey(value){
 const bytes=new TextEncoder().encode(normalizePassword(value));
 let material;try{material=await crypto.subtle.importKey('raw',bytes,'PBKDF2',false,['deriveKey']);}finally{bytes.fill(0);}
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:decodeBase64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decryptReport(key){
 const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decodeBase64(payload.iv),tagLength:128},key,decodeBase64(payload.ciphertext));
 return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
}
function displayReport(html,currentOperation,sessionText){
 if(currentOperation!==operation)return;
 const frame=document.createElement('iframe');
 frame.title='全球困境矿山报告';
 frame.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
 frame.setAttribute('referrerpolicy','no-referrer');
 frame.srcdoc=html;
 frameHost.replaceChildren(frame);
 $('session-message').textContent=sessionText;
 workspace.hidden=false;gate.hidden=true;setBusy(false);passwordInput.value='';rememberInput.checked=false;showMessage('');
 document.title='全球困境矿山 · 机会观察';
}
async function unlockWithPassword(event){
 event.preventDefault();
 if(!cryptoReady)return;
 const value=passwordInput.value,remember=rememberInput.checked;
 if(!normalizePassword(value)){showMessage('请输入访问口令。',true);passwordInput.focus();return;}
 const currentOperation=++operation;setBusy(true);showMessage('正在本地解密，请稍候。');passwordInput.value='';
 try{
  const key=await deriveKey(value),html=await decryptReport(key);
  if(currentOperation!==operation)return;
  let sessionText='已在本地解密';
  if(remember){const saved=await saveRemembered(key,currentOperation);sessionText=saved?'已记住此浏览器':'本次已解锁；浏览器未允许记住权限';}
  else clearRemembered();
  displayReport(html,currentOperation,sessionText);
 }catch{
  if(currentOperation!==operation)return;
  setBusy(false);showMessage('口令不正确，或报告数据不完整。请检查后重试。',true);passwordInput.focus();
 }
}
async function tryRememberedAccess(){
 const bytes=readRemembered();if(!bytes)return;
 const currentOperation=++operation;setBusy(true);showMessage('正在使用此浏览器保存的访问权限。');
 try{
  let key;try{key=await crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['decrypt']);}finally{bytes.fill(0);}
  const html=await decryptReport(key);displayReport(html,currentOperation,'已记住此浏览器');
 }catch{
  if(currentOperation!==operation)return;
  clearRemembered();setBusy(false);showMessage('保存的访问权限无法打开本次报告，请重新输入口令。',true);
 }
}
function lockAndForget(){
 ++operation;const cleared=clearRemembered();
 workspace.hidden=true;frameHost.replaceChildren();gate.hidden=false;passwordInput.value='';rememberInput.checked=false;setBusy(false);
 document.title='全球困境矿山 · 访问入口';
 showMessage(cleared?'已锁定，并清除本浏览器记住的访问权限。':'已锁定。浏览器未允许清除保存权限，请在浏览器设置中清除本站数据。',!cleared);passwordInput.focus();
}
function initialise(){
 refreshTheme();setInterval(refreshTheme,60000);
 form.addEventListener('submit',unlockWithPassword);$('lock-button').addEventListener('click',lockAndForget);
 try{
  payload=JSON.parse($('encrypted-report').textContent);
  if(payload.v!==1||payload.kdf!=='PBKDF2'||payload.hash!=='SHA-256'||payload.iterations!==600000||decodeBase64(payload.salt).length!==16||decodeBase64(payload.iv).length!==12||decodeBase64(payload.ciphertext).length<=16)throw new Error('Invalid report data');
 }catch{button.disabled=true;showMessage('加密报告数据不完整，请重新获取完整网页。',true);return;}
 cryptoReady=typeof crypto!=='undefined'&&!!crypto.subtle&&typeof TextEncoder!=='undefined'&&typeof TextDecoder!=='undefined';
 if(!cryptoReady){button.disabled=true;showMessage('当前环境不支持安全解密。请使用支持 Web Crypto 的新版浏览器打开此文件，或通过 HTTPS 打开网址。',true);return;}
 tryRememberedAccess();
}
initialise();
})();
</script>
